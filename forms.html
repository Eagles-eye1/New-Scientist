<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="forms.css">
</head>
<body>
        


    <section>
        <h2>Leave a comment</h2>
        <form action="" method="post"> 

            <!-- Name -->
            <label for="name">Name:</label>
            <input type="text"
             id="name" 
             name="name"
            required
            maxlength= "20"
            >
            <br>
            
            <!-- Email -->
            <label for="email">Email:</label>
            <input type="email"
             id="email" 
             name="email"
            required
            maxlength= "20"
            >
            <br>

            <!-- Comment -->
            <label for="comment">Comment:</label>
            <textarea 
            id="comment"
            name="comment" 
            required
            maxlength= "250"
            placeholder= "Type your comment here..."
            ></textarea>

        <br>

            <!-- Opinion -->
            
            <p>What is your overall opinion about this article?</p>
            <div class="radio-group">
                <label>
                    <input type="radio" name="opinion" value="positive" required>
                    Positive
                </label>
                
                <label>
                    <input type="radio" name="opinion" value="neutral" required>
                    Neutral
                </label>
                
                <label>
                    <input type="radio" name="opinion" value="negative" required>
                    Negative
                </label>
            </div>

            <!-- Newsletter -->
            <label>
                <input type="checkbox" name="newsletter" value="yes">
                I want to subscribe to the newsletter
            </label>

            <!-- Submit -->
            <input type="submit" value="Submit">

        
        </form>
    </section>

</body>
</html>
